{% extends "base.html" %}
{% block title %}运行中{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <p class="eyebrow">Running</p>
    <h1>文献检索运行中…</h1>
    <p class="subtitle">后台正在执行 tracker。最新文献通常 1–3 分钟；指定年份/年度检索可能更久，完成后将自动跳转。</p>
  </div>
  <div class="hero-actions">
    <a class="button ghost" href="/runs/latest">查看本方向最近运行</a>
    <a class="button ghost" href="/papers">文献库</a>
  </div>
</section>

<section class="content-band">
  <p id="wait-status" class="meta">正在检测运行状态…（第 <span id="try-count">{{ tries }}</span> 次）</p>
  <pre id="log-tail" class="log-preview">{{ log_tail }}</pre>
  <p class="meta">若年度检索长时间未跳转，请先看日志尾部；任务可能仍在 Semantic Scholar 检索，或网络/API 暂时失败。</p>
</section>

<script>
(function () {
  const after = {{ after }};
  const since = {{ since }};
  let tries = {{ tries }};

  async function poll() {
    tries += 1;
    document.getElementById("try-count").textContent = String(tries);
    try {
      const res = await fetch(`/api/run-status?after=${after}&since=${since}&tries=${tries}`);
      const data = await res.json();
      if (data.log_tail) {
        document.getElementById("log-tail").textContent = data.log_tail;
      }
      if (data.done) {
        const target = data.run_id ? `/runs/${data.run_id}?from_waiting=1` : "/fetch?run_finished_no_db=1";
        window.location.replace(target);
        return;
      }
      document.getElementById("wait-status").textContent =
        data.finished_marker
          ? "检测到任务已结束，正在跳转…"
          : `运行中…（约 ${Math.min(tries * 2, 600)} 秒，年度检索较慢属正常）`;
    } catch (e) {
      document.getElementById("wait-status").textContent = "状态检测失败，2 秒后重试…";
    }
    if (tries < 90) {
      setTimeout(poll, 2000);
    } else {
      window.location.href = `/runs/waiting?after=${after}&since=${since}&tries=${tries}`;
    }
  }
  setTimeout(poll, 2000);
})();
</script>
{% endblock %}
